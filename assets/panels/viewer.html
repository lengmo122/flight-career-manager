<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>模飞生涯 · 面板</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08090a;color:#eceff2;font:14px system-ui;letter-spacing:0}
    body{display:grid;grid-template-rows:44px minmax(0,1fr);overflow:hidden}
    header{display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid #34383b;background:#17191c}
    header strong{font-size:14px;white-space:nowrap}#status{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#aeb8bd}
    button{width:32px;height:32px;border:1px solid #535b60;border-radius:4px;color:inherit;background:#24282c;cursor:pointer;font-size:22px}
    main{min-height:0;min-width:0;overflow:auto;display:grid;place-items:center}img{display:block;width:100%;height:100%;min-height:0;object-fit:contain}img:not([src]){visibility:hidden}
    img.stretch{object-fit:fill}img.native{width:auto;height:auto;max-width:none;max-height:none}
    body:fullscreen{grid-template-rows:minmax(0,1fr)}body:fullscreen header{display:none}
  </style>
</head>
<body><header><strong>模飞生涯</strong><span id="status" role="status">正在连接</span><button id="fullscreen" title="全屏" aria-label="全屏">⛶</button></header><main><img id="panel" alt="驾驶舱面板"></main><script src="/viewer.js"></script></body>
</html>
